[pytest]
minversion = 7.0
testpaths = test
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --cov=ub_device_manager 覆盖率只统计 ub_device_manager 包；test/ 不在 source 内，不会被计入分母
addopts =
    -ra
    --strict-markers
    --strict-config
    --junitxml=report/ut-report.xml
    --cov=ub_device_manager
    --cov-report=term-missing
    --cov-report=xml:report/coverage.xml
    --cov-report=html:report/htmlcov

filterwarnings =
    ignore::DeprecationWarning
