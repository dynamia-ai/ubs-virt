name: ENPU runtime latest

on:
  pull_request:
    paths:
      - 'ubs-virt-enpu/vcann-rt/**'
      - 'LICENSE'
      - 'packaging/enpu-runtime/**'
      - '.github/workflows/enpu-runtime-latest.yml'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishers; an older run must not replace a newer master image.
concurrency:
  group: enpu-runtime-latest-${{ github.event_name == 'pull_request' && github.ref || 'master' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dynamia-ai/enpu-runtime
  CANN_VERSION: 9.1.0

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export this commit's runtime source
        run: bash packaging/enpu-runtime/prepare-context.sh '' "$GITHUB_SHA" "$GITHUB_REF"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .build/enpu-runtime
          platforms: linux/arm64
          provenance: false
          push: false
          build-args: |
            CANN_VERSION=${{ env.CANN_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=sha-${{ github.sha }}-cann${{ env.CANN_VERSION }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export this commit's runtime source
        run: bash packaging/enpu-runtime/prepare-context.sh '' "$GITHUB_SHA" master
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .build/enpu-runtime
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-cann${{ env.CANN_VERSION }}
          build-args: |
            CANN_VERSION=${{ env.CANN_VERSION }}
            SOURCE_REVISION=${{ github.sha }}
            IMAGE_VERSION=sha-${{ github.sha }}-cann${{ env.CANN_VERSION }}
      - name: Install image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Update latest for this CANN version
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: bash packaging/enpu-runtime/promote-latest.sh
