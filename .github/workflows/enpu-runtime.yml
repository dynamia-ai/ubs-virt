name: ENPU runtime image

on:
  pull_request:
    paths: ['packaging/enpu-runtime/**', '.github/workflows/enpu-runtime.yml']
  push:
    branches: [master]
    paths: ['packaging/enpu-runtime/**', '.github/workflows/enpu-runtime.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned runtime image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: enpu-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dynamia-ai/enpu-runtime:1.0.0-cann9.1.0-r1

jobs:
  build:
    if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned release source
        run: bash packaging/enpu-runtime/prepare-context.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate runtime build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/enpu-runtime
          platforms: linux/arm64
          provenance: false
          push: false

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export pinned release source
        run: bash packaging/enpu-runtime/prepare-context.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2> inspect.err; then
            echo 'Version already published. Increment the packaging revision instead of overwriting it.' >&2
            exit 1
          elif ! grep -Fq "${IMAGE}: not found" inspect.err; then
            cat inspect.err >&2
            exit 1
          fi
      - name: Build runtime assets
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .build/enpu-runtime
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
